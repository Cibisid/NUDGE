name: NUDGE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-cov httpx

      - name: Ruff lint
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Security check — no dynamic code execution
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          BAD = {"exec", "eval", "compile", "__import__"}
          failures = []
          for path in pathlib.Path("backend").rglob("*.py"):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in BAD:
                      failures.append(f"{path}:{node.lineno} calls {node.func.id}()")
          if failures:
              print("\n".join(failures)); sys.exit(1)
          print("no dynamic code execution found")
          PY

      - name: Tests
        env:
          GROQ_API_KEY: test-key
        run: pytest backend/tests/ --cov=backend --cov-report=term-missing

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile --target production -t nudge-backend:${{ github.sha }} .
